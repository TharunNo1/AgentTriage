environment: local
image:
  repository: ""
  tag: ""
  pullSecrets: []

existingSecret: agent-triage-runtime
config: {}

api:
  replicas: 1
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {memory: 512Mi}
  autoscaling:
    enabled: false
    maxReplicas: 3
    targetCPU: 70

worker:
  replicas: 1
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 512Mi}
  autoscaling:
    enabled: false
    maxReplicas: 3
    metricName: ""
    targetQueueDepth: 10

migrations:
  activeDeadlineSeconds: 300
