apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "triage.name" . }}-migrate
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 1
  activeDeadlineSeconds: {{ .Values.migrations.activeDeadlineSeconds }}
  template:
    spec:
      {{- include "triage.podSecurity" . | nindent 6 }}
      restartPolicy: Never
      containers:
        - name: migrate
          {{- include "triage.container" . | nindent 10 }}
          command: ["alembic", "upgrade", "head"]
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
