name: agent-triage

x-app: &app
  build:
    context: ..
  env_file:
    - path: ../.env
      required: false
  environment:
    TRIAGE_DATABASE_URL: postgresql+asyncpg://triage:triage@postgres:5432/triage
    TRIAGE_REDIS_URL: redis://redis:6379/0
    TRIAGE_LOG_JSON: "true"
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: triage
      POSTGRES_PASSWORD: triage
      POSTGRES_DB: triage
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U triage"]
      interval: 2s
      retries: 30

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 30

  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  api:
    <<: *app
    ports: ["8000:8000"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz')"]
      interval: 5s
      retries: 20

  dashboard:
    profiles: [dashboard]
    build:
      context: ../frontend
    environment:
      TRIAGE_API_UPSTREAM: api:8000
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      api:
        condition: service_healthy
        restart: true

  worker:
    <<: *app
    command: ["arq", "app.workers.main.WorkerSettings"]
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
