[project]
name = "agent-triage"
version = "0.2.0"
description = "Autonomous SRE incident triage platform: ingest, deduplicate, analyse, and remediate alerts safely."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "arq>=0.26",
    "asyncpg>=0.29",
    "fastapi>=0.165.0",
    "prometheus-client>=0.21",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
    "redis>=5.2",
    "sqlalchemy[asyncio]>=2.0.36",
    "structlog>=24.4",
    "uvicorn[standard]>=0.32",
]

[project.scripts]
agent-triage = "app.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pytest-cov>=6.0",
    "pytest-mock>=3.14",
    "ruff>=0.17.6",
    "testcontainers[postgres,redis]>=4.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 130
target-version = "py313"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "SIM", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
files = ["app"]

[[tool.mypy.overrides]]
module = ["arq.*", "testcontainers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing"
markers = ["integration: requires Docker (testcontainers)"]

[tool.coverage.run]
source = ["app"]
concurrency = ["greenlet", "thread"]
